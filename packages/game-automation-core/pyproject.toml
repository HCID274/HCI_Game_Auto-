[project]
name = "hci-game-automation-core"
version = "0.1.0"
description = "Shared Windows desktop, UU lifecycle, and reporting infrastructure"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "pyautogui>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_automation_core"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9.1.1"]


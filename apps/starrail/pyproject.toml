[project]
name = "starrail-auto"
version = "0.1.0"
description = "星穹铁道日常自动化（UU加速 + M7A启动 + 看门狗）"
requires-python = ">=3.12"
dependencies = [
    "hci-game-automation-core",
    "openai>=2.48.0",
    "opencv-python>=4.9",
    "pillow>=12.2.0",
    "psutil>=5.9",
    "pyautogui>=0.9",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
hci-game-automation-core = { workspace = true }

[project.scripts]
starrail-auto = "starrail_auto.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starrail_auto"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
